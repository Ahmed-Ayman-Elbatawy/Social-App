<aside class="rounded-3xl border border-gray-200 bg-white p-2 lg:p-3">
  <nav class="flex gap-1 overflow-x-auto [scrollbar-width:none] lg:flex-col lg:overflow-visible">
    <a
      routerLink="/timeline"
      [routerLinkActiveOptions]="{ exact: true }"
      routerLinkActive="bg-mainColor/10! text-mainColor!"
      class="flex shrink-0 items-center gap-3 rounded-xl px-4 py-2.5 text-sm font-bold text-slate-700 transition hover:bg-secondaryColor"
    >
      <i class="fa-regular fa-newspaper w-5 text-center text-base"></i>
      <span>Feed</span>
    </a>

    <a
      routerLink="/timeline/my-posts"
      routerLinkActive="bg-mainColor/10! text-mainColor!"
      class="flex shrink-0 items-center gap-3 rounded-xl px-4 py-2.5 text-sm font-bold text-slate-700 transition hover:bg-secondaryColor"
    >
      <i class="fa-solid fa-wand-magic-sparkles w-5 text-center text-base"></i>
      <span class="whitespace-nowrap">My Posts</span>
    </a>

    <a
      routerLink="/timeline/community"
      routerLinkActive="bg-mainColor/10! text-mainColor!"
      class="flex shrink-0 items-center gap-3 rounded-xl px-4 py-2.5 text-sm font-bold text-slate-700 transition hover:bg-secondaryColor"
    >
      <i class="fa-solid fa-earth-americas w-5 text-center text-base"></i>
      <span>Community</span>
    </a>

    <a
      routerLink="/timeline/saved"
      routerLinkActive="bg-mainColor/10! text-mainColor!"
      class="flex shrink-0 items-center gap-3 rounded-xl px-4 py-2.5 text-sm font-bold text-slate-700 transition hover:bg-secondaryColor"
    >
      <i class="fa-regular fa-bookmark w-5 text-center text-base"></i>
      <span>Saved</span>
    </a>
  </nav>
</aside>
